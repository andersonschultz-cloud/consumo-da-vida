<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" role="img" aria-labelledby="title desc">
  <title id="title">Instituto Schultz</title>
  <desc id="desc">Símbolo IS com órbitas, representando conexão, consciência e transformação.</desc>
  <defs>
    <linearGradient id="g" x1="30" y1="20" x2="190" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36c7c9"/>
      <stop offset="1" stop-color="#0c7f9e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="110" cy="110" r="72" fill="none" stroke="url(#g)" stroke-width="5" opacity=".95"/>
  <ellipse cx="110" cy="110" rx="86" ry="48" fill="none" stroke="url(#g)" stroke-width="4" transform="rotate(30 110 110)" opacity=".9"/>
  <ellipse cx="110" cy="110" rx="86" ry="48" fill="none" stroke="url(#g)" stroke-width="4" transform="rotate(-30 110 110)" opacity=".76"/>
  <g fill="url(#g)" filter="url(#soft)">
    <circle cx="49" cy="61" r="7"/><circle cx="168" cy="54" r="7"/><circle cx="184" cy="132" r="7"/>
    <circle cx="124" cy="184" r="7"/><circle cx="43" cy="143" r="7"/><circle cx="109" cy="38" r="7"/>
  </g>
  <text x="110" y="132" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="66" font-weight="700" letter-spacing="-5" fill="url(#g)">IS</text>
</svg>
